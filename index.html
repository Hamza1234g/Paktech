<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PakCart Marketplace</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e4e8ef;--brand:#ff5a1f;--nav:#182033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--nav);color:#fff;padding:7px 4%;font-size:12px}.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}.navin{max-width:1300px;margin:auto;padding:12px 18px;display:flex;gap:12px;align-items:center}.logo{font-size:25px;font-weight:900;color:var(--brand)}.search{flex:1;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}.search input{flex:1;padding:11px;border:0;background:transparent;outline:0}.search button,.primary{background:var(--brand);color:#fff;border:0;padding:11px 17px;border-radius:8px;font-weight:800}.navbtn{background:transparent;border:0;color:var(--text);padding:9px}.wrap{max-width:1300px;margin:auto;padding:22px 18px}.hero{border-radius:18px;padding:45px;background:linear-gradient(110deg,#182033,#ff5a1f);color:#fff}.hero h1{font-size:clamp(32px,5vw,58px);max-width:750px;margin:0 0 12px}.hero p{max-width:650px;color:#ffe7de}.cats,.grid{display:grid;gap:14px}.cats{grid-template-columns:repeat(6,1fr)}.grid{grid-template-columns:repeat(5,1fr)}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.cat{text-align:center;padding:20px 8px}.product{overflow:hidden;padding:0}.pic{height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#fff0e9);font-size:55px}.pbody{padding:13px}.price{font-size:19px;font-weight:900;margin-top:8px}.old{text-decoration:line-through;color:var(--muted);font-size:12px}.add{width:100%;margin-top:9px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}.admin{display:grid;grid-template-columns:220px 1fr;min-height:70vh}.aside{background:#111827;color:#fff;padding:16px}.aside button{display:block;width:100%;padding:11px;text-align:left;background:transparent;color:#fff;border:0;border-radius:7px;margin:3px 0}.aside button:hover{background:#293449}.main{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.table{width:100%;border-collapse:collapse;background:var(--card)}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:15px}.modal.on{display:grid}.box{background:var(--card);padding:22px;border-radius:15px;width:min(900px,96vw);max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.form input,.form select,.form textarea{padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.cats{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.admin{grid-template-columns:1fr}.aside{display:flex;overflow:auto}.aside button{min-width:130px}}@media(max-width:600px){.navin{flex-wrap:wrap}.search{order:5;flex-basis:100%}.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.hero{padding:30px 20px}}
</style></head>
<body>
<div class="top">Pakistan-focused marketplace · Seller Center · Help · Track Order</div>
<nav class="nav"><div class="navin"><div class="logo">PakCart</div><div class="search"><input id="q" placeholder="Search products, brands & categories"><button onclick="loadProducts()">Search</button></div><button class="navbtn" onclick="home()">Home</button><button class="navbtn" onclick="shop()">Shop</button><button class="navbtn" onclick="login()">Account</button><button class="navbtn" onclick="cart()">Cart 🛒</button></div></nav>
<div id="app"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
let token=localStorage.token||"", me=null, cartItems=JSON.parse(localStorage.cart||"[]");
const api=async(u,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(o.body&&typeof o.body!=="string"){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d};
const money=n=>"Rs. "+Number(n).toLocaleString("en-PK");
async function home(){let ps=await api("/api/products");let cs=await api("/api/categories");app.innerHTML=`<main class="wrap"><section class="hero"><h1>One marketplace. Thousands of possibilities.</h1><p>Products, sellers, orders and operations managed from one flexible platform.</p><button class="primary" onclick="shop()">Shop Now</button></section><div class="sectionhead"><h2>Categories</h2></div><div class="cats">${cs.map(c=>`<div class="card cat" onclick="shop('${c.slug}')">🛒<b>${c.name}</b></div>`).join("")}</div><div class="sectionhead"><h2>Featured Products</h2><button class="primary" onclick="shop()">View All</button></div><div class="grid">${ps.map(card).join("")}</div></main>`}
function card(p){return `<div class="card product"><div class="pic">${p.image||"📦"}</div><div class="pbody"><b>${p.name}</b><div class="price">${money(p.price)} <span class="old">${p.compare_price?money(p.compare_price):""}</span></div><small>${p.seller||"PakCart"} · ★ ${p.rating||"New"}</small><button class="primary add" onclick="add(${p.id})">Add to Cart</button></div></div>`}
async function shop(cat=""){let ps=await api("/api/products?"+(cat?"category="+encodeURIComponent(cat):""));app.innerHTML=`<main class="wrap"><div class="sectionhead"><h2>Shop</h2><button class="primary" onclick="home()">Home</button></div><div class="grid">${ps.map(card).join("")}</div></main>`}
async function loadProducts(){let q=document.getElementById("q").value;let ps=await api("/api/products?q="+encodeURIComponent(q));app.innerHTML=`<main class="wrap"><div class="sectionhead"><h2>Search Results</h2></div><div class="grid">${ps.map(card).join("")}</div></main>`}
function add(id){let x=cartItems.find(x=>x.product_id===id);if(x)x.qty++;else cartItems.push({product_id:id,qty:1});localStorage.cart=JSON.stringify(cartItems);alert("Added to cart")}
async function cart(){let ps=await api("/api/products");let rows=cartItems.map(x=>{let p=ps.find(p=>p.id===x.product_id);return p?{...p,qty:x.qty}:null}).filter(Boolean);let total=rows.reduce((a,p)=>a+p.price*p.qty,0);show(`<h2>Cart</h2>${rows.map(p=>`<p>${p.name} × ${p.qty} — <b>${money(p.price*p.qty)}</b></p>`).join("")}<hr><h3>Total: ${money(total)}</h3><button class="primary" onclick="checkout()">Checkout</button>`)}
function show(c){box.innerHTML=c;modal.classList.add("on")}function close(){modal.classList.remove("on")}
async function checkout(){if(!token)return login();show(`<h2>Checkout</h2><div class="form"><textarea id="addr" placeholder="Full delivery address"></textarea><select id="pay"><option value="cod">Cash on Delivery</option><option value="stripe">Online Card / Stripe</option></select><button class="primary" onclick="place()">Place Order</button></div>`)}
async function place(){try{let o=await api("/api/orders",{method:"POST",body:{items:cartItems,payment_method:pay.value,shipping_address:addr.value}});cartItems=[];localStorage.cart="[]";if(o.payment_method==="stripe"){let s=await api("/api/payments/create-checkout",{method:"POST",body:{order_id:o.order_id}});location.href=s.url}else{close();alert("Order #"+o.order_id+" placed");}}catch(e){alert(e.message)}}
function login(){show(`<h2>Login</h2><div class="form"><input id="email" placeholder="Email" value="admin@pakcart.local"><input id="pass" type="password" placeholder="Password" value="ChangeMe123!"><button class="primary" onclick="doLogin()">Login</button><small>Admin credentials are defined in your server .env.</small></div>`)}
async function doLogin(){try{let r=await api("/api/auth/login",{method:"POST",body:{email:email.value,password:pass.value}});token=r.token;me=r.user;localStorage.token=token;close();if(me.role==="admin")admin();else if(me.role==="seller")seller();else home()}catch(e){alert(e.message)}}
async function admin(){let a=await api("/api/admin/analytics");app.innerHTML=`<main class="admin"><aside class="aside"><button onclick="admin()">Overview</button><button onclick="adminProducts()">Products</button><button onclick="adminOrders()">Orders</button><button onclick="adminUsers()">Users & Sellers</button><button onclick="adminSections()">Homepage Sections</button><button onclick="adminAudit()">Audit Log</button><button onclick="home()">Storefront</button></aside><section class="main"><h1>Admin Control Center</h1><div class="stats"><div class="stat"><small>Revenue</small><strong>${money(a.revenue)}</strong></div><div class="stat"><small>Orders</small><strong>${a.orders}</strong></div><div class="stat"><small>Users</small><strong>${a.users}</strong></div><div class="stat"><small>Products</small><strong>${a.products}</strong></div></div><br><div class="panel"><h2>Inventory</h2><p>Total units in stock: <b>${a.stock}</b></p><h3>Order Status</h3>${a.byStatus.map(x=>`<p>${x.status}: ${x.count}</p>`).join("")}</div><br><div class="panel"><h2>Top Products</h2><table class="table"><tr><th>Product</th><th>Units</th><th>Sales</th></tr>${a.top.map(x=>`<tr><td>${x.name}</td><td>${x.units}</td><td>${money(x.sales)}</td></tr>`).join("")}</table></div></section></main>`}
async function adminProducts(){let ps=await api("/api/products"),cs=await api("/api/categories");app.innerHTML=`<main class="admin"><aside class="aside"><button onclick="admin()">Overview</button><button onclick="adminProducts()">Products</button><button onclick="adminSections()">Homepage Sections</button><button onclick="home()">Storefront</button></aside><section class="main"><div class="sectionhead"><h1>All Products</h1><button class="primary" onclick="productForm(${JSON.stringify(cs).replaceAll('"','&quot;')})">+ Add Product</button></div><table class="table"><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Seller</th><th>Action</th></tr>${ps.map(p=>`<tr><td>${p.name}</td><td>${p.category||""}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.seller||"—"}</td><td><button onclick="editProduct(${p.id})">Edit</button> <button onclick="delProduct(${p.id})">Delete</button></td></tr>`).join("")}</table></section></main>`}
async function productForm(cs){show(`<h2>Add Product</h2><div class="form"><input id="pn" placeholder="Product name"><select id="pc">${cs.map(c=>`<option value="${c.id}">${c.name}</option>`)}</select><input id="pp" type="number" placeholder="Price"><input id="ps" type="number" placeholder="Stock"><input id="pb" placeholder="Brand"><input id="pi" placeholder="Image/emoji"><button class="primary" onclick="createProduct()">Create</button></div>`)}
async function createProduct(){await api("/api/products",{method:"POST",body:{name:pn.value,category_id:+pc.value,price:+pp.value,stock:+ps.value,brand:pb.value,image:pi.value}});close();adminProducts()}
async function editProduct(id){let ps=await api("/api/products");let p=ps.find(x=>x.id===id);show(`<h2>Edit Product</h2><div class="form"><input id="en" value="${p.name}"><input id="ep" type="number" value="${p.price}"><input id="es" type="number" value="${p.stock}"><input id="eb" value="${p.brand||""}"><button class="primary" onclick="saveProduct(${id})">Save</button></div>`)}
async function saveProduct(id){await api("/api/products/"+id,{method:"PUT",body:{name:en.value,price:+ep.value,stock:+es.value,brand:eb.value}});close();adminProducts()}
async function delProduct(id){if(confirm("Delete this product?")){await api("/api/products/"+id,{method:"DELETE"});adminProducts()}}
async function adminOrders(){let os=await api("/api/orders");app.innerHTML=`<main class="admin"><aside class="aside"><button onclick="admin()">Overview</button><button onclick="adminOrders()">Orders</button><button onclick="adminProducts()">Products</button><button onclick="home()">Storefront</button></aside><section class="main"><h1>All Orders</h1><table class="table"><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr>${os.map(o=>`<tr><td>#${o.id}</td><td>${o.customer}</td><td>${money(o.total)}</td><td>${o.status}</td><td><select onchange="setStatus(${o.id},this.value)"><option>${o.status}</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></td></tr>`).join("")}</table></section></main>`}
async function setStatus(id,s){await api("/api/orders/"+id+"/status",{method:"PUT",body:{status:s}});alert("Updated")}
async function adminUsers(){let us=await api("/api/admin/users");show(`<h2>Users & Sellers</h2><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>${us.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.status}</td></tr>`).join("")}</table>`)}
async function adminSections(){let ss=await api("/api/sections");app.innerHTML=`<main class="admin"><aside class="aside"><button onclick="admin()">Overview</button><button onclick="adminProducts()">Products</button><button onclick="adminSections()">Homepage Sections</button><button onclick="home()">Storefront</button></aside><section class="main"><div class="sectionhead"><h1>Homepage Sections</h1><button class="primary" onclick="addSection()">+ Add Section</button></div><p>Add, remove, reorder or deactivate homepage content blocks without changing code.</p><table class="table"><tr><th>Title</th><th>Type</th><th>Position</th><th>Active</th><th>Action</th></tr>${ss.map(s=>`<tr><td>${s.title}</td><td>${s.kind}</td><td>${s.position}</td><td>${s.active?"Yes":"No"}</td><td><button onclick="delSection(${s.id})">Delete</button></td></tr>`).join("")}</table></section></main>`}
function addSection(){show(`<h2>Add Homepage Section</h2><div class="form"><input id="st" placeholder="Section title"><select id="sk"><option value="products">Products</option><option value="categories">Categories</option><option value="banner">Banner</option><option value="custom">Custom</option></select><input id="sp" type="number" value="10"><button class="primary" onclick="createSection()">Add Section</button></div>`)}
async function createSection(){await api("/api/sections",{method:"POST",body:{title:st.value,kind:sk.value,position:+sp.value}});close();adminSections()}
async function delSection(id){if(confirm("Remove section?")){await api("/api/sections/"+id,{method:"DELETE"});adminSections()}}
async function adminAudit(){let a=await api("/api/admin/audit");show(`<h2>Audit Log</h2><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>${a.map(x=>`<tr><td>${x.created_at}</td><td>${x.name||"system"}</td><td>${x.action}</td><td>${x.entity} #${x.entity_id||""}</td><td>${x.details||""}</td></tr>`).join("")}</table>`)}
async function seller(){let ps=await api("/api/products");app.innerHTML=`<main class="admin"><aside class="aside"><button onclick="seller()">Overview</button><button onclick="adminProducts()">My Products</button><button onclick="adminOrders()">My Orders</button><button onclick="home()">Storefront</button></aside><section class="main"><h1>Seller Center</h1><div class="stats"><div class="stat"><small>My Products</small><strong>${ps.filter(p=>p.seller==="Demo Seller").length}</strong></div><div class="stat"><small>Inventory</small><strong>${ps.reduce((a,p)=>a+p.stock,0)}</strong></div></div></section></main>`}
home();
</script></body></html>
